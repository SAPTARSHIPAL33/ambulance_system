<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Routing Prototype</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    <style>
        #map { height: 600px; width: 100%; }
        body { font-family: sans-serif; margin: 20px; }
        .controls { margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Emergency Routing Visualization</h2>
    <div class="controls">
        <p><strong>Scenario:</strong> Ambulance (Green) -> Victim (Red) -> Top 3 Eligible Hospitals (Blue)</p>
        <p><strong>Bounding Box:</strong> Red Dashed Line (Predicted viewport)</p>
    </div>
    
    <div id="map"></div>

    <script>
        // --- 1. MOCK DATA (Simulating Backend Response) ---
        const MOCK_DATA = {
            ambulance_loc: [40.7600, -73.9900], // Near Times Square
            victim_loc: [40.7829, -73.9654],    // Central Park
            route_polyline: [
                [40.7600, -73.9900], 
                [40.7650, -73.9800], 
                [40.7750, -73.9700], 
                [40.7829, -73.9654]
            ],
            hospitals: [
                { id: 1, name: "Central General Hospital", lat: 40.7829, lon: -73.9654 },
                { id: 2, name: "Northside Trauma Center", lat: 40.7950, lon: -73.9500 },
                { id: 3, name: "East River Medical", lat: 40.7700, lon: -73.9400 }
            ],
            // Pre-calculated BBox from backend logic (approximate for demo)
            bbox: [[40.755, -74.00], [40.80, -73.93]]
        };

        // --- 2. INITIALIZE MAP ---
        var map = L.map('map').setView(MOCK_DATA.victim_loc, 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // --- 3. PLOT LAYERS ---

        // Ambulance Marker (Green)
        var ambulanceIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        L.marker(MOCK_DATA.ambulance_loc, {icon: ambulanceIcon}).addTo(map)
            .bindPopup("<b>Ambulance</b><br>Dispatcher Location");

        // Victim Marker (Red)
        var victimIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        L.marker(MOCK_DATA.victim_loc, {icon: victimIcon}).addTo(map)
            .bindPopup("<b>Victim</b><br>Emergency Site");

        // Route Polyline (Blue)
        var latlngs = MOCK_DATA.route_polyline;
        var polyline = L.polyline(latlngs, {color: 'blue', weight: 4, opacity: 0.7}).addTo(map);

        // Hospitals (Blue - Default)
        MOCK_DATA.hospitals.forEach(h => {
             L.marker([h.lat, h.lon]).addTo(map)
                .bindPopup(`<b>${h.name}</b><br>Eligible Hospital`);
        });

        // --- 4. DRAW BOUNDING BOX ---
        // Leaflet takes bounds as [[lat1, lon1], [lat2, lon2]]
        var bounds = MOCK_DATA.bbox;
        L.rectangle(bounds, {color: "#ff0000", weight: 2, fill: false, dashArray: "5, 5"}).addTo(map)
            .bindPopup("Computed Bounding Box");

        // --- 5. FIT VIEW TO BBOX ---
        map.fitBounds(bounds);

    </script>
</body>
</html>
